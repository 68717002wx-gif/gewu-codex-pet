name: Interaction Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  interaction-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run interaction regression
        run: npm test

      - name: Upload interaction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-regression-artifacts
          path: |
            qa/artifacts/interaction/pet-interaction-check-report.json
            qa/artifacts/interaction/pet-interaction-check.webm
            qa/artifacts/interaction/pet-interaction-check.mp4
